[package]
name = "ghrg"
repository = "https://github.com/ryankurte/ghrg"
description = "A simple CLI for fetching GitHub release artifacts from (public|private) repositories."
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
glob = "0.3.4"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
test-log = "0.2.21"
